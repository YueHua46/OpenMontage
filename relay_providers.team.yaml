# 团队共享的中转站模型配置（可提交：只含环境变量名，不含任何密钥）
#
# 使用：在自己的 .env 中写入
#   OPENMONTAGE_RELAY_CONFIG=relay_providers.team.yaml
#   TSTSTS_MEDIA_API_KEY=<你自己的生图/生视频 Key>
#   OMNIAKEY_API_KEY=<你自己的视频 Key>
#   FISH_AUDIO_API_KEY=<你自己的配音 Key>
#   TSTSTS_TEXT_API_KEY=<你自己的文本 Key>（可选）
# 然后运行 python -m tools.relay check。
#
# 模型 ID 来自 2026-11-04 GET /v1/models 的实际返回，并已真实出片验证
# （gpt-image-2 文生图/图生图、grok-imagine-video-1.5 本地首帧图生视频）。
# 协议参照 clipforge 已验证的实现（openai.ts 的 Images 协议、xai.ts 的 Grok 视频协议）。
#
# 生图默认 gpt-image-2.6；tststs 价格按 2026-11-09 中转站价格页（图片 ¥0.006–0.01/张，grok 视频 720p ¥0.09/s）。
# ⚠ 其他未注明的 pricing 仍为估算，仅用于预算闸门；请按实际账单修改。
# ⚠ live: true 表示允许真实计费请求。

version: 1
routing:
  paid_provider_policy: relay_only
  default_tools:
    image: relay_tststs_gpt_image_2_6
    video: relay_tststs_grok_video_1_5
relays:
  tststs:
    display_name: vvvvvip 中转（生图）
    base_url: https://vvvvvip.tststs.shop
    api_key_env: TSTSTS_MEDIA_API_KEY
    live: true
    models:
    - name: gpt-image-2
      model: gpt-image-2
      protocol: openai_images
      capabilities:
      - text_to_image
      - image_to_image
      image_input: multipart
      limits:
        max_reference_images: 4
        size_map:
          '16:9': 1536x864
          '9:16': 864x1536
          '1:1': 1024x1024
      defaults:
        size: 864x1536
      pricing:
        currency: CNY
        per_image: 0.01
      submit_timeout_seconds: 240
      best_for:
      - 文字渲染
      - 商品保真图生图
      - 分镜首帧
      - 风格化修图
    - name: gpt-image-2-5
      model: gpt-image-2.5
      protocol: openai_images
      capabilities:
      - text_to_image
      - image_to_image
      image_input: multipart
      limits:
        max_reference_images: 4
        size_map:
          '16:9': 1536x864
          '9:16': 864x1536
          '1:1': 1024x1024
      defaults:
        size: 864x1536
      pricing:
        currency: CNY
        per_image: 0.01
      submit_timeout_seconds: 240
    - name: gpt-image-2-6
      tool_name: relay_tststs_gpt_image_2_6
      model: gpt-image-2.6
      protocol: openai_images
      capabilities:
      - text_to_image
      - image_to_image
      image_input: multipart
      limits:
        max_reference_images: 4
        size_map:
          '16:9': 1536x864
          '9:16': 864x1536
          '1:1': 1024x1024
      defaults:
        size: 864x1536
      pricing:
        currency: CNY
        per_image: 0.01
      submit_timeout_seconds: 240
      best_for:
      - 文字渲染
      - 商品保真图生图
      - 分镜首帧
      - 风格化修图
  tststs-video:
    enabled: true
    display_name: vvvvvip 中转（生视频）
    base_url: https://vvvvvip.tststs.shop
    api_key_env: TSTSTS_MEDIA_API_KEY
    live: true
    models:
    - name: grok-video
      enabled: false
      model: grok-imagine-video
      protocol: generic_async
      api_root: /v1
      kind: video
      capabilities:
      - text_to_video
      - image_to_video
      image_input: data_uri
      limits:
        duration_range:
        - 1
        - 15
        aspect_ratios:
        - '16:9'
        - '9:16'
        - '1:1'
        resolutions:
        - 480p
        - 720p
        max_image_mb: 10
        max_upload_kb: 900
      defaults:
        duration: 5
        aspect_ratio: '9:16'
        resolution: 720p
      pricing:
        per_second: 0.1
      poll:
        interval_seconds: 5
        timeout_seconds: 900
      submit_timeout_seconds: 120
      best_for:
      - 首帧动画
      - 竖屏短视频
      - 电影感运镜
      request: &id001
        submit:
          method: POST
          path: /videos/generations
          body_format: json
          body:
            model: '{{model}}'
            prompt: '{{prompt}}'
            duration: '{{duration}}'
            aspect_ratio: '{{aspect_ratio}}'
            resolution: '{{resolution}}'
            image:
              url: '{{first_frame}}'
        response:
          task_id: request_id|id|task_id|data.request_id
          error: error.message|error|message
        poll:
          method: GET
          path: /videos/{task_id}
          status: status|data.status
          success:
          - done
          - completed
          - succeeded
          failure:
          - failed
          - expired
          - error
          - cancelled
          error: error.message|error|message
          result_url: video.url|data.video.url|url
    - name: grok-video-1-5
      tool_name: relay_tststs_grok_video_1_5
      model: grok-imagine-video-1.5
      protocol: generic_async
      api_root: /v1
      kind: video
      capabilities:
      - text_to_video
      - image_to_video
      image_input: data_uri
      limits:
        duration_range:
        - 1
        - 15
        aspect_ratios:
        - '16:9'
        - '9:16'
        - '1:1'
        resolutions:
        - 480p
        - 720p
        - 1080p
        max_upload_kb: 900
      defaults:
        duration: 5
        aspect_ratio: '9:16'
        resolution: 720p
      pricing:
        currency: CNY
        per_second_by_resolution:
          480P: 0.07
          720P: 0.09
          1080P: 0.11
      poll:
        interval_seconds: 5
        timeout_seconds: 900
      request: *id001
  omniakey:
    display_name: OmniaKey（MiniMax H3 视频）
    base_url: https://api.omniakey.com
    api_key_env: OMNIAKEY_API_KEY
    live: true
    models:
    - name: minimax-h3
      model: minimax-h3
      aliases:
      - MiniMax-H3
      protocol: generic_async
      api_root: /v1
      kind: video
      capabilities:
      - text_to_video
      - image_to_video
      - first_last_frame
      - reference_to_video
      image_input: data_uri
      limits:
        duration_range:
        - 4
        - 15
        resolutions:
        - 768P
        - 2K
        aspect_ratios:
        - adaptive
        - '16:9'
        - '9:16'
        - '1:1'
        - '4:3'
        - '3:4'
        - '21:9'
        native_audio: true
        max_request_bytes: 1048576
        max_upload_kb: 700
      defaults:
        duration: 4
        resolution: 768P
        aspect_ratio: '16:9'
      pricing:
        currency: USD
        per_second_by_resolution:
          768P: 0.0269
          2K: 0.0431
      agent_skills:
      - minimax-h3
      poll:
        interval_seconds: 5
        timeout_seconds: 600
      request:
        submit:
          method: POST
          path: /media/tasks
          headers:
            Idempotency-Key: '{{idempotency_key}}'
          body:
            model: '{{model}}'
            type: video
            operation: '{{operation}}'
            input:
              prompt: '{{prompt}}'
              media: '{{media}}'
            parameters:
              duration: '{{duration}}'
              resolution: '{{resolution}}'
              aspect_ratio: '{{aspect_ratio}}'
        response:
          task_id: id|data.id
          error: error.message|error|message
        poll:
          method: GET
          path: /media/tasks/{task_id}
          status: status|data.status
          success:
          - succeeded
          failure:
          - failed
          - canceled
          - cancelled
          - expired
          error: error.message|error.code|message
          result_url: assets.0.url|data.assets.0.url
  tststs-text:
    display_name: vvvvvip 中转（文本）
    base_url: https://vvvvvip.tststs.shop
    api_key_env: TSTSTS_TEXT_API_KEY
    live: true
    models:
    - name: gpt-5-5
      model: gpt-5.5
      protocol: openai_chat
      capabilities:
      - chat
      - vision
    - name: gpt-6-sol
      model: gpt-6-sol
      protocol: openai_chat
      capabilities:
      - chat
